<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAKE RETRO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg: #060610;
    --panel: #0a0a18;
    --green: #39ff14;
    --green-dim: #1a6a08;
    --green-glow: rgba(57,255,20,0.3);
    --red: #ff2244;
    --amber: #ffb300;
  }

  html { margin: 0; padding: 0; background: var(--bg); }

  /* ── POPUP (por defecto) ── */
  body {
    width: 520px;
    height: 740px;
    margin: 0; padding: 0;
    overflow: hidden;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    color: var(--green);
    gap: 0;
  }

  /* ── VENTANA COMPLETA ── */
  body.fs-mode {
    width: 100vw;
    height: 100vh;
    justify-content: center;
  }

  /* CRT scanlines */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
    );
    pointer-events: none; z-index: 100;
  }

  /* Vignette */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.8) 100%);
    pointer-events: none; z-index: 99;
  }

  h1 {
    font-size: 1.4rem;
    letter-spacing: 0.3em;
    text-shadow: 0 0 10px var(--green), 0 0 30px var(--green-glow), 0 0 60px var(--green-glow);
    margin: 0 0 10px 0;
    animation: flicker 6s infinite;
  }
  body.fs-mode h1 { font-size: 2rem; margin-bottom: 16px; }

  @keyframes flicker {
    0%,96%,100% { opacity: 1; }
    97% { opacity: 0.6; }
    98% { opacity: 1; }
    99% { opacity: 0.4; }
  }

  /* ── HUD ── */
  .hud-row {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
    position: relative;
    width: 100%;
    justify-content: center;
  }

  .hud {
    display: flex;
    gap: 20px;
    font-size: 0.44rem;
    letter-spacing: 0.08em;
    align-items: center;
  }
  body.fs-mode .hud { font-size: 0.6rem; gap: 32px; }

  .hud span { color: var(--amber); }
  .hud b    { color: var(--green); text-shadow: 0 0 8px var(--green); }
  #lives    { color: #ff4466; text-shadow: 0 0 8px rgba(255,68,102,0.5); }

  /* ── Botón fullscreen ── */
  #fsBtn {
    position: absolute;
    right: 12px;
    background: none;
    border: 1px solid var(--green-dim);
    color: var(--green-dim);
    font-size: 1rem;
    line-height: 1;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 3px;
    transition: 0.15s;
    font-family: monospace;
  }
  #fsBtn:hover {
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 10px var(--green-glow);
  }
  body.fs-mode #fsBtn { display: none; }

  /* ── Power-up bar ── */
  .powerup-bar {
    height: 14px;
    margin-bottom: 5px;
    font-size: 0.35rem;
    letter-spacing: 0.15em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.fs-mode .powerup-bar { font-size: 0.45rem; height: 18px; margin-bottom: 8px; }

  #powerUpLabel {
    opacity: 0;
    transition: opacity 0.3s;
    animation: blink-slow 1s infinite;
  }
  @keyframes blink-slow {
    0%,80%,100% { opacity: 1; }
    90%          { opacity: 0.4; }
  }

  /* ── Arena ── */
  .arena-wrap {
    position: relative;
    border: 2px solid var(--green-dim);
    box-shadow: 0 0 25px var(--green-glow), 0 0 60px rgba(57,255,20,0.08), inset 0 0 25px rgba(0,0,0,0.6);
    border-radius: 4px;
    background: var(--panel);
  }

  canvas { display: block; image-rendering: pixelated; }

  /* ── Overlays ── */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.88);
    gap: 12px; z-index: 10;
    text-align: center;
    backdrop-filter: blur(2px);
  }
  body.fs-mode .overlay { gap: 18px; }

  .overlay h2 {
    font-size: 1rem;
    text-shadow: 0 0 20px var(--green);
    letter-spacing: 0.2em;
    animation: pulse 1.4s ease-in-out infinite;
    margin: 0;
  }
  body.fs-mode .overlay h2 { font-size: 1.5rem; }

  .overlay .game-over-title {
    color: var(--red);
    text-shadow: 0 0 20px var(--red), 0 0 50px rgba(255,34,68,0.4);
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.45; }
  }

  .overlay p { font-size: 0.38rem; color: #888; line-height: 2; margin: 0; }
  body.fs-mode .overlay p { font-size: 0.5rem; }

  .score-display {
    font-size: 0.52rem;
    color: var(--amber);
    text-shadow: 0 0 8px var(--amber);
  }
  body.fs-mode .score-display { font-size: 0.7rem; }

  .btn {
    background: none;
    border: 2px solid var(--green);
    color: var(--green);
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    padding: 9px 18px;
    cursor: pointer;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 12px var(--green-glow);
    transition: 0.15s;
    letter-spacing: 0.1em;
  }
  .btn:hover { background: var(--green); color: #000; box-shadow: 0 0 25px var(--green-glow); }
  body.fs-mode .btn { font-size: 0.65rem; padding: 12px 28px; }

  .legend { font-size: 0.3rem; line-height: 2.2; color: #666; margin-top: 4px; }
  body.fs-mode .legend { font-size: 0.42rem; }
  .legend .dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-right: 5px;
    vertical-align: middle; position: relative; top: -1px;
  }
  .legend span { color: #999; }

  .controls-hint {
    margin-top: 8px;
    font-size: 0.3rem; color: #444;
    line-height: 2.2; text-align: center;
  }

  /* Mobile D-pad */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 40px);
    gap: 3px; margin-top: 10px;
  }
  .dpad-btn {
    background: rgba(57,255,20,0.06);
    border: 1px solid var(--green-dim);
    color: var(--green); font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    transition: background 0.1s; touch-action: manipulation;
  }
  .dpad-btn:active { background: rgba(57,255,20,0.2); }
  .dpad-btn.empty  { visibility: hidden; }

  @media (hover: none) {
    .dpad { display: grid; }
    .controls-hint { display: none; }
  }
</style>
</head>
<body>

<h1>◈ SNAKE ◈</h1>

<div class="hud-row">
  <div class="hud">
    <div><span>PTS </span><b id="score">000</b></div>
    <div><span>MAX </span><b id="best">000</b></div>
    <div><span>LVL </span><b id="level">1</b></div>
    <div><span>♥ </span><b id="lives">♥♥♥</b></div>
  </div>
  <button id="fsBtn" title="Ventana completa">⛶</button>
</div>

<div class="powerup-bar">
  <span id="powerUpLabel"></span>
</div>

<div class="arena-wrap">
  <canvas id="c"></canvas>

  <!-- START -->
  <div class="overlay" id="startScreen">
    <h2>SNAKE</h2>
    <p>GUÍA A LA SERPIENTE<br>Y COME PARA CRECER</p>
    <button class="btn" id="startBtn">▶ INICIAR</button>
    <div class="legend">
      <div><span class="dot" style="background:#ff2244;box-shadow:0 0 6px #ff2244"></span><span>NORMAL — +10 pts</span></div>
      <div><span class="dot" style="background:#ffd700;box-shadow:0 0 6px #ffd700"></span><span>★ DOBLE PUNTOS 6s</span></div>
      <div><span class="dot" style="background:#00cfff;box-shadow:0 0 6px #00cfff"></span><span>❄ CÁMARA LENTA 5s</span></div>
      <div><span class="dot" style="background:#bb88ff;box-shadow:0 0 6px #bb88ff"></span><span>◈ MODO FANTASMA 7s</span></div>
    </div>
    <div class="controls-hint">WASD / FLECHAS → MOVER &nbsp;|&nbsp; P → PAUSA</div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay" id="gameOverScreen" style="display:none">
    <h2 class="game-over-title">GAME OVER</h2>
    <div class="score-display" id="finalScore"></div>
    <div class="score-display" id="finalBest" style="font-size:0.38rem;color:#888;margin-top:-4px"></div>
    <button class="btn" id="restartBtn">↺ REINICIAR</button>
  </div>

  <!-- PAUSE -->
  <div class="overlay" id="pauseScreen" style="display:none">
    <h2>PAUSA</h2>
    <p>PULSA P PARA CONTINUAR</p>
  </div>
</div>

<!-- Mobile D-pad -->
<div class="dpad" id="dpad">
  <div class="dpad-btn empty"></div>
  <div class="dpad-btn" id="btnUp">▲</div>
  <div class="dpad-btn empty"></div>
  <div class="dpad-btn" id="btnLeft">◀</div>
  <div class="dpad-btn empty"></div>
  <div class="dpad-btn" id="btnRight">▶</div>
  <div class="dpad-btn empty"></div>
  <div class="dpad-btn" id="btnDown">▼</div>
  <div class="dpad-btn empty"></div>
</div>

<div class="controls-hint" id="mainHint" style="display:none">
  WASD / FLECHAS → MOVER &nbsp;|&nbsp; P → PAUSA
</div>

<script src="snake.js"></script>
</body>
</html>
